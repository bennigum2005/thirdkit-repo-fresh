<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Kit — Takk fyrir!</title>
<meta name="robots" content="noindex">
<style>
  :root{--black:#0a0a0a;--gold:#d4af37;--gold-bright:#f0cf5d;--text:#f5f2e9;--muted:#9a9587}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(ellipse 60% 45% at 50% 0%, rgba(212,175,55,.12), transparent 70%),var(--black);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px 6vw;background:rgba(10,10,10,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,55,.18)}
  .logo{font-size:1.35rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--text);text-decoration:none}
  .logo span{color:var(--gold)}
  main{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 6vw 50px;animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .check{width:88px;height:88px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:var(--gold-bright);margin-bottom:28px;box-shadow:0 0 40px rgba(212,175,55,.18)}
  h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  h1 span{color:var(--gold)}
  p{color:var(--muted);max-width:460px;margin:18px 0 0;line-height:1.8;font-size:.95rem}
  .ref{margin-top:14px;font-size:.78rem;color:var(--gold-bright);letter-spacing:.1em}
  .btn{display:inline-block;margin-top:34px;padding:14px 42px;font-size:.8rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;border-radius:2px;border:1px solid var(--gold-bright);background:linear-gradient(120deg,var(--gold),var(--gold-bright));color:#0a0a0a;transition:transform .18s ease, box-shadow .18s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,175,55,.35)}
</style>
</head>
<body>
<header><a class="logo" href="index.html">Third<span>&nbsp;Kit</span></a></header>
<main>
  <div class="check">✓</div>
  <h1>Takk <span>fyrir!</span></h1>
  <p>Greiðslan tókst og pöntunin þín er staðfest. Kvittun frá greiðslusíðunni er á leiðinni í tölvupóstinn þinn.</p>
  <p class="ref" id="ref"></p>
  <a class="btn" href="index.html">Aftur á forsíðu</a>
</main>
<script>
  const ref = new URLSearchParams(location.search).get("ReferenceNumber");
  if(ref) document.getElementById("ref").textContent = "Pöntunarnúmer: " + ref;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Kit — Karfa</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --black:#0a0a0a;
    --black-2:#121212;
    --black-3:#1a1a1a;
    --gold:#d4af37;
    --gold-bright:#f0cf5d;
    --gold-dim:rgba(212,175,55,.35);
    --text:#f5f2e9;
    --muted:#9a9587;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(212,175,55,.10), transparent 70%),
      var(--black);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:10px 6vw;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(212,175,55,.18);
  }
  .logo img{height:56px;display:block}
  main{
    height:100vh;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 6vw 46px;text-align:center;
    animation:fade .45s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .back{
    color:var(--muted);text-decoration:none;font-size:.75rem;
    letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px;
    display:inline-block;transition:color .2s;
  }
  .back:hover{color:var(--gold-bright)}
  .card{
    background:linear-gradient(180deg,var(--black-3),var(--black-2));
    border:1px solid rgba(212,175,55,.22);
    border-radius:6px;padding:clamp(24px,4vh,42px) clamp(26px,4vw,42px);
    max-width:460px;width:100%;position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  h1{
    font-size:1.3rem;text-transform:uppercase;letter-spacing:.2em;font-weight:800;
    margin-bottom:22px;
  }
  h1 span{color:var(--gold)}
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08);
    font-size:.92rem;
  }
  .row .lbl{color:var(--muted);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
  .row .val{font-weight:600}
  .qty{display:flex;align-items:center;gap:14px}
  .qty button{
    width:34px;height:34px;border-radius:3px;cursor:pointer;
    background:transparent;color:var(--gold-bright);
    border:1px solid var(--gold-dim);font-size:1.1rem;font-family:inherit;
    transition:border-color .15s;
  }
  .qty button:hover{border-color:var(--gold-bright)}
  .qty .n{min-width:24px;font-weight:700;font-size:1rem}
  .total .val{color:var(--gold-bright);font-weight:800;font-size:1.25rem}
  .terms{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin:20px 0 18px;font-size:.78rem;color:var(--muted);
  }
  .terms input{accent-color:var(--gold);width:16px;height:16px;cursor:pointer}
  .terms a{color:var(--gold);text-decoration:none}
  .terms a:hover{color:var(--gold-bright)}
  .btn{
    display:inline-block;width:100%;padding:15px 38px;
    font-size:.8rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    cursor:pointer;border-radius:2px;border:1px solid var(--gold-bright);
    background:linear-gradient(120deg,var(--gold),var(--gold-bright));color:#0a0a0a;
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s;
    font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,175,55,.35)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .secure{margin-top:12px;font-size:.7rem;color:var(--muted);letter-spacing:.08em}
  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    text-align:center;padding:12px 6vw;color:var(--muted);font-size:.68rem;
    letter-spacing:.14em;pointer-events:none;
  }
  footer a{color:var(--gold);text-decoration:none;pointer-events:auto}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html"><img src="logo.png" alt="Third Kit"></a>
</header>

<main>
  <a class="back" id="backlink" href="index.html">← Til baka</a>
  <div class="card">
    <h1>Karfan <span>þín</span></h1>
    <div class="row"><span class="lbl">Vara</span><span class="val" id="pname">—</span></div>
    <div class="row"><span class="lbl">Stærð</span><span class="val" id="psize">—</span></div>
    <div class="row"><span class="lbl">Verð</span><span class="val" id="punit">—</span></div>
    <div class="row"><span class="lbl">Magn</span>
      <span class="qty">
        <button onclick="chg(-1)" aria-label="Fækka">−</button>
        <span class="n" id="pqty">1</span>
        <button onclick="chg(1)" aria-label="Fjölga">+</button>
      </span>
    </div>
    <div class="row total"><span class="lbl">Samtals</span><span class="val" id="ptotal">—</span></div>
    <label class="terms">
      <input type="checkbox" id="accept">
      <span>Ég samþykki <a href="skilmalar.html" target="_blank">skilmálana</a></span>
    </label>
    <button class="btn" id="paybtn" onclick="pay()" disabled>Greiða</button>
    <p class="secure">Greiðslan fer fram á öruggri greiðslusíðu Valitor</p>
  </div>
</main>

<footer>
  &copy; 2026 Third Kit. Allur réttur áskilinn. &nbsp;·&nbsp; <a href="skilmalar.html">Skilmálar</a>
</footer>

<script>
  /* =====================================================
     EDIT THIS BLOCK ONLY
     ===================================================== */
  const PAY_URL = "PASTE-PAY-URL";   // t.d. "https://thirdkit-func.azurewebsites.net/api/pay"
  const PRODUCTS = {
    adult: { name: "Third Kit — Fullorðins", price: 9990, page: "index.html?product=adult" },
    kids:  { name: "Third Kit — Barna",      price: 8990, page: "index.html?product=kids" }
  };
  const MAX_QTY = 5;
  /* ===================================================== */

  const params = new URLSearchParams(location.search);
  const product = (params.get("product") || "").toLowerCase();
  const size = params.get("size") || "";
  const cfg = PRODUCTS[product];
  let qty = 1;

  if (!cfg || !size) { location.href = "index.html"; }

  const kr = n => n.toLocaleString("is-IS").replace(/,/g, ".") + " kr.";

  function render(){
    document.getElementById("pname").textContent = cfg.name;
    document.getElementById("psize").textContent = size;
    document.getElementById("punit").textContent = kr(cfg.price);
    document.getElementById("pqty").textContent = qty;
    document.getElementById("ptotal").textContent = kr(cfg.price * qty);
    document.getElementById("backlink").href = cfg.page;
  }
  function chg(d){
    qty = Math.min(MAX_QTY, Math.max(1, qty + d));
    render();
  }
  document.getElementById("accept").addEventListener("change", e => {
    document.getElementById("paybtn").disabled = !e.target.checked;
  });
  function pay(){
    if (!PAY_URL || PAY_URL.startsWith("PASTE")){
      alert("Greiðslutenging hefur ekki verið sett upp — bættu PAY_URL við efst í <script> hlutanum.");
      return;
    }
    location.href = PAY_URL + "?product=" + product + "&size=" + encodeURIComponent(size) + "&qty=" + qty;
  }
  render();
</script>

</body>
</html>

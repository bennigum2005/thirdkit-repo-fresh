<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Kit</title>
<meta name="description" content="Third Kit — svart og gull. Fullorðins- og barnastærðir.">
<style>
  :root{
    --black:#0a0a0a;
    --black-2:#121212;
    --black-3:#1a1a1a;
    --gold:#d4af37;
    --gold-bright:#f0cf5d;
    --gold-dim:rgba(212,175,55,.35);
    --text:#f5f2e9;
    --muted:#9a9587;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(212,175,55,.10), transparent 70%),
      var(--black);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:10px 6vw;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(212,175,55,.18);
  }
  .logo img{height:56px;display:block}

  .shop{
    height:100vh;height:100dvh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:90px 6vw 50px;
    animation:fade .45s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .wrap{
    display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);
    align-items:center;max-width:1020px;width:100%;
  }
  .visual{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,var(--black-3),var(--black-2));
    border:1px solid rgba(212,175,55,.22);border-radius:8px;
    padding:clamp(20px,5vh,50px);position:relative;overflow:hidden;
  }
  .visual::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .visual svg{
    width:clamp(180px,36vh,330px);height:auto;
    filter:drop-shadow(0 16px 36px rgba(0,0,0,.55));
  }
  .info{text-align:left}
  .info h1{
    font-size:clamp(1.9rem,4.4vh,2.7rem);font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;
  }
  .price{
    font-size:1.55rem;font-weight:800;color:var(--gold-bright);
    margin:10px 0 4px;letter-spacing:.04em;
  }
  .pick-label{
    margin:20px 0 10px;font-size:.72rem;font-weight:700;
    letter-spacing:.26em;text-transform:uppercase;color:var(--muted);
  }
  .pills{display:flex;gap:12px;flex-wrap:wrap}
  .pills button{
    background:var(--black-2);color:var(--text);
    border:1.5px solid rgba(255,255,255,.22);border-radius:14px;
    min-width:74px;padding:16px 20px;cursor:pointer;
    font-size:.95rem;font-weight:700;letter-spacing:.08em;
    font-family:inherit;transition:all .15s ease;
  }
  .pills button:hover{border-color:var(--gold-dim);color:var(--gold-bright)}
  .pills button.selected{
    background:linear-gradient(120deg,var(--gold),var(--gold-bright));
    color:#0a0a0a;border-color:var(--gold-bright);font-weight:800;
    box-shadow:0 6px 18px rgba(212,175,55,.28);
  }
  .pills button:disabled{
    opacity:.32;text-decoration:line-through;cursor:not-allowed;
    border-color:rgba(255,255,255,.1);color:var(--muted);
  }
  .soldout-note{
    color:var(--gold-bright);font-size:.8rem;margin-top:14px;letter-spacing:.06em;
    display:none;
  }
  .btn{
    display:inline-block;width:100%;padding:16px 38px;margin-top:26px;
    font-size:.85rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    text-decoration:none;cursor:pointer;border-radius:14px;border:1px solid var(--gold-bright);
    background:linear-gradient(120deg,var(--gold),var(--gold-bright));color:#0a0a0a;
    transition:transform .18s ease, box-shadow .18s ease;
    font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,175,55,.35)}
  .secure{margin-top:12px;font-size:.7rem;color:var(--muted);letter-spacing:.08em}

  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    text-align:center;padding:12px 6vw;color:var(--muted);font-size:.68rem;
    letter-spacing:.14em;pointer-events:none;
  }
  footer a{color:var(--gold);text-decoration:none;pointer-events:auto}
  footer a:hover{color:var(--gold-bright)}

  @media (max-width:760px){
    .shop{padding:86px 6vw 44px}
    .wrap{grid-template-columns:1fr;gap:18px;max-width:420px}
    .visual{padding:14px}
    .visual svg{width:clamp(120px,20vh,190px)}
    .info{text-align:center}
    .pills{justify-content:center}
  }

  /* Intro video overlay */
  #intro{
    position:fixed;inset:0;z-index:100;background:#000;
    opacity:1;transition:opacity 2s ease;
  }
  #intro.fade{opacity:0;pointer-events:none}
  #intro video{width:100%;height:100%;object-fit:cover}
  #intro .skip{
    position:absolute;bottom:34px;right:34px;
    background:rgba(10,10,10,.55);color:var(--gold-bright);
    border:1px solid rgba(212,175,55,.45);border-radius:2px;
    padding:10px 22px;cursor:pointer;font-family:inherit;
    font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    backdrop-filter:blur(6px);transition:border-color .2s;
  }
  #intro .skip:hover{border-color:var(--gold-bright)}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html"><img src="logo.png" alt="Third Kit"></a>
</header>

<section class="shop">
  <div class="wrap">
    <div class="visual">
      <svg id="jersey-adult" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M62 28 L84 18 Q100 30 116 18 L138 28 L172 52 L156 82 L142 72 L142 176 Q100 188 58 176 L58 72 L44 82 L28 52 Z"
              fill="#161616" stroke="#d4af37" stroke-width="3" stroke-linejoin="round"/>
        <path d="M84 18 Q100 30 116 18 Q112 34 100 34 Q88 34 84 18Z" fill="#d4af37"/>
        <path d="M70 100 H130" stroke="#d4af37" stroke-width="3"/>
        <path d="M70 112 H130" stroke="#d4af37" stroke-width="3"/>
        <text x="100" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold"
              font-size="20" fill="#f0cf5d" letter-spacing="2">III</text>
      </svg>
      <svg id="jersey-kids" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
        <path d="M62 28 L84 18 Q100 30 116 18 L138 28 L172 52 L156 82 L142 72 L142 176 Q100 188 58 176 L58 72 L44 82 L28 52 Z"
              fill="#d4af37" stroke="#f0cf5d" stroke-width="3" stroke-linejoin="round"/>
        <path d="M84 18 Q100 30 116 18 Q112 34 100 34 Q88 34 84 18Z" fill="#161616"/>
        <path d="M70 100 H130" stroke="#0a0a0a" stroke-width="3"/>
        <path d="M70 112 H130" stroke="#0a0a0a" stroke-width="3"/>
        <text x="100" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold"
              font-size="20" fill="#0a0a0a" letter-spacing="2">III</text>
      </svg>
    </div>

    <div class="info">
      <h1>Third Kit</h1>
      <div class="price" id="price">—</div>

      <div class="pick-label">Veldu útgáfu</div>
      <div class="pills" id="cats">
        <button data-cat="adult" onclick="pickCat('adult')">Fullorðins</button>
        <button data-cat="kids" onclick="pickCat('kids')">Barna</button>
      </div>

      <div class="pick-label">Veldu stærð</div>
      <div class="pills" id="sizes"></div>
      <p class="soldout-note" id="soldout">Því miður seldist þessi stærð upp — veldu aðra stærð.</p>

      <button class="btn" onclick="buy()">Setja í körfu</button>
      <p class="secure">Þú verður send/ur áfram á örugga greiðslusíðu</p>
    </div>
  </div>
</section>

<footer>
  &copy; 2026 Third Kit. Allur réttur áskilinn. &nbsp;·&nbsp; <a href="skilmalar.html">Skilmálar</a>
</footer>

<div id="intro">
  <video id="introVideo" src="intro.mp4" autoplay muted playsinline preload="auto"></video>
  <button class="skip" onclick="endIntro()">Sleppa →</button>
</div>

<script>
  /* =====================================================
     EDIT THIS BLOCK ONLY
     ===================================================== */
  const AVAILABILITY_URL = "PASTE-AVAILABILITY-URL"; // t.d. "https://thirdkit-func.azurewebsites.net/api/availability"
  const PRODUCTS = {
    adult: { label: "Fullorðins", price: "9.990 kr.", sizes: ["XS","S","M","L","XL","XXL"] },
    kids:  { label: "Barna",      price: "8.990 kr.", sizes: ["128","140","152","164","176"] }
  };
  /* ===================================================== */

  const params = new URLSearchParams(location.search);
  let cat = params.get("product") === "kids" ? "kids" : "adult";
  let selectedSize = null;
  let stock = null; // fyllist frá availability-endapunktinum

  function pickCat(c){
    cat = c;
    selectedSize = null;
    render();
  }
  function pickSize(size, el){
    if (el.disabled) return;
    selectedSize = size;
    render();
  }
  function render(){
    document.getElementById("price").textContent = PRODUCTS[cat].price;
    document.getElementById("jersey-adult").style.display = cat === "adult" ? "" : "none";
    document.getElementById("jersey-kids").style.display  = cat === "kids"  ? "" : "none";
    document.querySelectorAll("#cats button").forEach(b =>
      b.classList.toggle("selected", b.dataset.cat === cat));

    const wrap = document.getElementById("sizes");
    wrap.innerHTML = "";
    for (const size of PRODUCTS[cat].sizes){
      const b = document.createElement("button");
      b.textContent = size;
      const out = stock && (stock[cat]?.[size] ?? 0) <= 0;
      if (out){ b.disabled = true; b.title = "Uppselt"; }
      if (selectedSize === size && !out) b.classList.add("selected");
      b.onclick = () => pickSize(size, b);
      wrap.appendChild(b);
    }
  }
  function buy(){
    if (!selectedSize){ alert("Vinsamlegast veldu stærð fyrst."); return; }
    location.href = "karfa.html?product=" + cat + "&size=" + encodeURIComponent(selectedSize);
  }

  if (params.get("soldout") === "1"){
    document.getElementById("soldout").style.display = "block";
  }

  /* Lifandi lagerstaða úr Business Central (gegnum middleware) */
  async function loadAvailability(){
    if (!AVAILABILITY_URL || AVAILABILITY_URL.startsWith("PASTE")) return;
    try{
      const res = await fetch(AVAILABILITY_URL);
      if (!res.ok) return;
      stock = await res.json();
      if (selectedSize && (stock[cat]?.[selectedSize] ?? 0) <= 0) selectedSize = null;
      render();
    }catch(e){ /* engin tenging — allar stærðir haldast virkar */ }
  }

  render();
  loadAvailability();

  /* Intro-myndbandið: spilast einu sinni í hverri heimsókn */
  (function(){
    const intro = document.getElementById("intro");
    const video = document.getElementById("introVideo");
    let ended = false;
    let seen = false;
    try { seen = sessionStorage.getItem("tk-intro") === "1"; } catch(e){}
    if (seen) { intro.remove(); return; }
    window.endIntro = function(){
      if (ended) return;
      ended = true;
      try { sessionStorage.setItem("tk-intro", "1"); } catch(e){}
      intro.classList.add("fade");
      setTimeout(() => intro.remove(), 2100);
    };
    video.addEventListener("ended", endIntro);
    video.addEventListener("error", endIntro);
    const p = video.play();
    if (p && p.catch) p.catch(endIntro);
    setTimeout(endIntro, 12000);
  })();
</script>

</body>
</html>

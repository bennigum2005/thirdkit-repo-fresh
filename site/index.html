<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Kit</title>
<meta name="description" content="Third Kit — svart og gull. Veldu fullorðins eða barna útgáfu.">
<style>
  :root{
    --black:#0a0a0a;
    --black-2:#121212;
    --black-3:#1a1a1a;
    --gold:#d4af37;
    --gold-bright:#f0cf5d;
    --gold-dim:rgba(212,175,55,.35);
    --text:#f5f2e9;
    --muted:#9a9587;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--black);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:18px 6vw;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(212,175,55,.18);
  }
  .logo{
    font-size:1.35rem;font-weight:800;letter-spacing:.28em;
    text-transform:uppercase;color:var(--text);text-decoration:none;
  }
  .logo span{color:var(--gold)}

  .front{
    height:100vh;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:80px 6vw 50px;
    animation:fade .45s ease;
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(212,175,55,.12), transparent 70%),
      var(--black);
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .front h1{
    font-size:clamp(2.4rem,7vh,5rem);
    font-weight:800;line-height:1.04;letter-spacing:.1em;
    text-transform:uppercase;
  }
  .front h1 .gold{
    background:linear-gradient(120deg,var(--gold) 20%,var(--gold-bright) 50%,var(--gold) 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .front .rule{
    width:90px;height:2px;margin:24px auto;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .choices{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:26px;width:min(760px,100%);margin:10px auto 0;
  }
  .choice{
    background:linear-gradient(180deg,var(--black-3),var(--black-2));
    border:1px solid rgba(212,175,55,.25);
    border-radius:6px;padding:clamp(20px,4vh,42px) 30px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s;
    text-decoration:none;color:var(--text);display:block;
  }
  .choice::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .choice:hover{
    transform:translateY(-6px);
    border-color:var(--gold);
    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 40px rgba(212,175,55,.14);
  }
  .choice .box-icon{width:clamp(70px,13vh,110px);height:auto;margin:0 auto 16px;display:block}
  .choice h2{
    font-size:1.45rem;text-transform:uppercase;letter-spacing:.14em;font-weight:800;
  }
  .choice p{color:var(--muted);font-size:.85rem;margin-top:10px;letter-spacing:.06em}
  .choice .go{
    display:inline-block;margin-top:22px;color:var(--gold);
    font-size:.75rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  }
  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    text-align:center;padding:12px 6vw;color:var(--muted);font-size:.68rem;
    letter-spacing:.14em;pointer-events:none;
  }
  footer a{color:var(--gold);text-decoration:none;pointer-events:auto}
  footer a:hover{color:var(--gold-bright)}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Third<span>&nbsp;Kit</span></a>
</header>

<section class="front">
  <h1>Third<br><span class="gold">Kit</span></h1>
  <div class="rule"></div>

  <div class="choices">
    <a class="choice" href="fullordins.html">
      <svg class="box-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M62 28 L84 18 Q100 30 116 18 L138 28 L172 52 L156 82 L142 72 L142 176 Q100 188 58 176 L58 72 L44 82 L28 52 Z"
              fill="#161616" stroke="#d4af37" stroke-width="3" stroke-linejoin="round"/>
        <path d="M84 18 Q100 30 116 18 Q112 34 100 34 Q88 34 84 18Z" fill="#d4af37"/>
        <path d="M70 100 H130" stroke="#d4af37" stroke-width="3"/>
        <path d="M70 112 H130" stroke="#d4af37" stroke-width="3"/>
        <text x="100" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold"
              font-size="20" fill="#f0cf5d" letter-spacing="2">III</text>
      </svg>
      <h2>Fullorðins</h2>
      <p>Stærðir XS–XXL</p>
      <span class="go">Skoða →</span>
    </a>

    <a class="choice" href="barna.html">
      <svg class="box-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M62 28 L84 18 Q100 30 116 18 L138 28 L172 52 L156 82 L142 72 L142 176 Q100 188 58 176 L58 72 L44 82 L28 52 Z"
              fill="#d4af37" stroke="#f0cf5d" stroke-width="3" stroke-linejoin="round"/>
        <path d="M84 18 Q100 30 116 18 Q112 34 100 34 Q88 34 84 18Z" fill="#161616"/>
        <path d="M70 100 H130" stroke="#0a0a0a" stroke-width="3"/>
        <path d="M70 112 H130" stroke="#0a0a0a" stroke-width="3"/>
        <text x="100" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold"
              font-size="20" fill="#0a0a0a" letter-spacing="2">III</text>
      </svg>
      <h2>Barna</h2>
      <p>Stærðir 128–176</p>
      <span class="go">Skoða →</span>
    </a>
  </div>
</section>

<footer>
  &copy; 2026 Third Kit. Allur réttur áskilinn. &nbsp;·&nbsp; <a href="skilmalar.html">Skilmálar</a>
</footer>

</body>
</html>
